<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle 1Z0-171 Quiz & Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- Left: Quiz Area -->
        <div class="quiz-section">
            <div class="header-hud">
                <div class="topic-badge" id="topic-badge">📂 Loading...</div>
                <div class="timer" id="timer"><i class="fas fa-clock"></i> 30s</div>
            </div>

            <div class="card-container">
                <div class="card" id="flashcard">
                    <div class="card-face card-front" id="card-front">Loading question...</div>
                    <div class="card-face card-back" id="card-back">Loading explanation...</div>
                </div>
            </div>

            <div class="options-grid" id="options-grid">
                <!-- Buttons injected via JS -->
            </div>

            <div class="controls">
                <button class="action-btn" id="btn-flip" onclick="flipCard()"><i class="fas fa-undo"></i> Flip for
                    Details</button>
                <button class="action-btn" id="btn-next" onclick="nextQuestion()">Next <i
                        class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Right: Scoreboard -->
        <div class="score-section">
            <h3>🏆 Performance</h3>
            <div id="scoreboard-list">
                <!-- Scores injected via JS -->
            </div>
            <div class="total-score" id="total-score">
                Total: 0 / 0
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
